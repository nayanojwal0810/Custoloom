[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "custoloom"
version = "0.1.0"
description = "Custoloom Analytical CRM and Customer Intelligence Engine"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
